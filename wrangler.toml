name = "ir-item-request"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ir-item-request-db"
database_id = "41a4bf4a-bcbf-4eae-9815-98e34335e219"

[vars]
ADMIN_IDS = "1890482340"   # comma-separated Telegram IDs
TZ_OFFSET = "3"           # Africa/Nairobi is UTC+3

[triggers]
crons = ["0 6 * * *"]     # daily 09:00 Africa/Nairobi - overdue reminders
